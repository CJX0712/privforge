[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privforge"
version = "0.1.0"
description = "World-class differential-privacy ML system (DP-SGD + RDP accountant + adaptive clipping). Author: 晨星"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星", email = "CJX0712@users.noreply.github.com" }]
keywords = ["differential-privacy", "dp-sgd", "rdp", "machine-learning", "privacy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.format]
quote-style = "double"
